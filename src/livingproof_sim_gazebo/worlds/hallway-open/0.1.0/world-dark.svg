<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="hallway-open-0-1-0-title hallway-open-0-1-0-desc">
<title id="hallway-open-0-1-0-title">Open hallway, hallway-open 0.1.0: top-down diagram</title>
<desc id="hallway-open-0-1-0-desc">Top-down diagram of hallway-open 0.1.0: a 6.00 m long hallway, 1.50 m clear between two 0.15 m walls, open at both ends. Entrance (IN) at x = -3.00, exit (OUT) at x = 3.00. Passage from y = -0.50 to 0.50 m around the centreline. Spawns: spawn-entrance at (-2.50, 0.00) yaw 0°; spawn-centre at (0.00, 0.00) yaw 0°; spawn-exit at (2.50, 0.00) yaw 180°.</desc>
<style>:root{--bg:#0d1117;--text:#e2e8f0;--muted:#94a3b8;--wall:#94a3b8;--floor:#1e293b;--dim:#94a3b8;--teal:#2dd4bf;--amber:#fbbf24;--spawn:#60a5fa}text{font-family:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:var(--text);font-size:12px}.title{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif;font-size:18px}.muted{fill:var(--muted)}.dimtext{font-size:13px;fill:var(--muted)}.wall{fill:var(--wall)}.floor{fill:var(--floor)}.passage{fill:var(--teal);fill-opacity:.10;stroke:var(--teal);stroke-dasharray:6 4}.centre{stroke:var(--teal);stroke-width:1.5;stroke-dasharray:2 4;fill:none}.entrance{fill:var(--teal)}.exit{stroke:var(--amber);stroke-width:6;stroke-dasharray:10 6}.tag-in{fill:var(--teal);font-weight:700}.tag-out{fill:var(--amber);font-weight:700}.spawn{fill:var(--spawn)}.yaw{fill:var(--spawn);stroke:var(--bg);stroke-width:3;paint-order:stroke;stroke-linejoin:round}.leader{stroke:var(--muted);stroke-width:1;fill:none}.dim{stroke:var(--dim);stroke-width:1;fill:none}.axis{stroke:var(--text);stroke-width:1.5;fill:none}.axishead{fill:var(--text)}</style>
