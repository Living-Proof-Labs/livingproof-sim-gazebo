name: Gazebo verification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: gazebo-verification-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - name: Verify development container without Docker inside
        run: |
          npm install --prefix "$RUNNER_TEMP/devcontainer-cli" @devcontainers/cli@0.89.0
          export PATH="$RUNNER_TEMP/devcontainer-cli/node_modules/.bin:$PATH"
          bash tools/test-devcontainer.sh
      - run: task verify
      - run: task docs
      - run: task package
      - run: task smoke
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        if: ${{ !cancelled() }}
        with:
          name: Gazebo tests (amd64)
          path: artifacts/*.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gazebo-evidence-amd64
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: gazebo-python-distributions
          path: dist/
          retention-days: 14
      - name: Upload Pages manual
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/manual
          retention-days: 1
  deploy-docs:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The workflow-wide main concurrency group remains held through deployment.
      # A rerun retains its old github.sha, so concurrency alone is insufficient.
      - name: Reject stale main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from urllib.request import Request, urlopen

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Refusing deployment outside main")
          request = Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Cache-Control": "no-cache",
              },
          )
          with urlopen(request, timeout=30) as response:
              current = json.load(response)["object"]["sha"]
          if current != os.environ["GITHUB_SHA"]:
              raise SystemExit("Refusing stale deployment: workflow revision is no longer main")
          print("Deployment revision matches current main")
          PYTHON
      - name: Deploy manual
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  publish-tests:
    needs: verify
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Gazebo tests (amd64)
          artifact: gazebo-evidence-amd64
          path: '*.xml'
          reporter: python-xunit
          fail-on-error: 'true'
          fail-on-empty: 'true'
