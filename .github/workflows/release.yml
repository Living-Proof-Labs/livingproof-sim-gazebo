# SPDX-License-Identifier: Apache-2.0
name: Gazebo release
on:
  workflow_run:
    workflows: [Gazebo verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gazebo-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.10.3
    with:
      draft-release: true
  assemble:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      # hatch-vcs versions from the tag, so package here rather than reuse the
      # untagged verify artifacts. This step requires the tag to name the same
      # commit verification already passed.
      - name: Require the release tag to name the verified commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - run: task package
      - run: task smoke
      - name: Checksum complete assets
        run: |
          cd dist
          test -f "livingproof_sim_gazebo-${VERSION}-py3-none-any.whl"
          test -f "livingproof_sim_gazebo-${VERSION}.tar.gz"
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: release-packages
          path: dist/
          retention-days: 14
      # --clobber lets a re-run of this failed job finish the existing draft
      # without moving the tag. A leftover draft stays unpublished.
      - name: Attach tested assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the release once every tested asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Verify anonymous release asset download
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          tmp="$(mktemp -d)"
          curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
          curl -fsSL "$base/livingproof_sim_gazebo-${VERSION}-py3-none-any.whl" -o "$tmp/livingproof_sim_gazebo-${VERSION}-py3-none-any.whl"
          curl -fsSL "$base/livingproof_sim_gazebo-${VERSION}.tar.gz" -o "$tmp/livingproof_sim_gazebo-${VERSION}.tar.gz"
          (cd "$tmp" && sha256sum -c SHA256SUMS)
  build-manual:
    outputs:
      artifact-name: ${{ steps.pages-name.outputs.name }}
      artifact-id: ${{ steps.pages.outputs.artifact-id }}
      tar-sha256: ${{ steps.pages-name.outputs.tar-sha256 }}
    needs: [release, assemble]
    if: needs.release.outputs.draft-created == 'true' && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - name: Read the exact published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > artifacts/manual-release.json
          python3 tools/manual_release.py validate --release artifacts/manual-release.json --tag "$RELEASE_TAG" --version "$VERSION" --sha "$GITHUB_SHA"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task docs -- --release artifacts/manual-release.json
      - name: Accept only the tested release bytes
        run: python3 tools/manual_release.py accept --release artifacts/manual-release.json --tag "$RELEASE_TAG" --version "$VERSION" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gazebo-manual-${{ needs.release.outputs.git-tag }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/manual/
            artifacts/manual-sha256.json
            artifacts/manual-release.json
          retention-days: 14
          if-no-files-found: error
      - name: Name this attempt and archive the accepted Pages bytes
        id: pages-name
        run: |
          echo "name=github-pages-${RELEASE_TAG}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          tar --directory artifacts/manual --create --file "$RUNNER_TEMP/artifact.tar" .
          digest=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          echo "tar-sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      # Upload directly to retain the immutable artifact ID.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: pages
        with:
          name: ${{ steps.pages-name.outputs.name }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy-docs:
    needs: [release, build-manual]
    if: needs.build-manual.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The release concurrency group remains held through deployment.
      # A rerun retains its old github.sha, so concurrency alone is insufficient.
      # Same-run native artifact service, following livingproof-worlds #41.
      - name: Require a valid Pages artifact ID
        env:
          UPLOADED_ID: ${{ needs.build-manual.outputs.artifact-id }}
        run: '[[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Read exact Pages artifact by id
        id: pages-id-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build-manual.outputs.artifact-id }}
          path: ${{ runner.temp }}/gazebo-pages-id-first
      - name: Allow the id lookup to settle
        if: steps.pages-id-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by id once
        id: pages-id-retry
        if: steps.pages-id-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build-manual.outputs.artifact-id }}
          path: ${{ runner.temp }}/gazebo-pages-id-retry
      - name: Read exact Pages artifact by name
        id: pages-name-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build-manual.outputs.artifact-name }}
          path: ${{ runner.temp }}/gazebo-pages-name-first
      - name: Allow the name lookup to settle
        if: steps.pages-name-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by name once
        id: pages-name-retry
        if: steps.pages-name-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build-manual.outputs.artifact-name }}
          path: ${{ runner.temp }}/gazebo-pages-name-retry
      - name: Require matching ID and name readback of the exact tar
        env:
          EXPECTED_TAR: ${{ needs.build-manual.outputs.tar-sha256 }}
          EXPECTED_NAME: ${{ needs.build-manual.outputs.artifact-name }}
          ID_READBACK: ${{ steps.pages-id-first.outcome == 'success' && steps.pages-id-first.outputs.download-path || steps.pages-id-retry.outputs.download-path }}
          NAME_READBACK: ${{ steps.pages-name-first.outcome == 'success' && steps.pages-name-first.outputs.download-path || steps.pages-name-retry.outputs.download-path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR" =~ ^[0-9a-f]{64}$ ]]
          test -n "$EXPECTED_NAME"
          test -n "$ID_READBACK"
          test -n "$NAME_READBACK"
          for path in "$ID_READBACK/$EXPECTED_NAME" "$NAME_READBACK"; do
            test -f "$path/artifact.tar"
            digest=$(sha256sum "$path/artifact.tar")
            test "${digest%% *}" = "$EXPECTED_TAR"
          done
      - name: Check deployment freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Refusing deployment outside main")
          request = Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Cache-Control": "no-cache",
              },
          )
          with urlopen(request, timeout=30) as response:
              current = json.load(response)["object"]["sha"]
          candidate = os.environ["GITHUB_SHA"]
          if not isinstance(current, str) or not re.fullmatch(r"[0-9a-f]{40}", current):
              raise SystemExit("Invalid current main SHA; refusing deployment")
          if not re.fullmatch(r"[0-9a-f]{40}", candidate):
              raise SystemExit("Invalid candidate SHA; refusing deployment")
          fresh = current == candidate
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"current={str(fresh).lower()}\n")
          if fresh:
              print("Deployment revision matches current main")
          else:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Skipped stale deployment: workflow revision is no longer main\n")
          PYTHON
      - name: Deploy manual
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.build-manual.outputs.artifact-name }}
