# SPDX-License-Identifier: Apache-2.0
name: Gazebo release
on:
  workflow_run:
    workflows: [Gazebo verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gazebo-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.6.14
    with:
      draft-release: true
  assemble:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      # hatch-vcs versions from the tag, so package here rather than reuse the
      # untagged verify artifacts. This step requires the tag to name the same
      # commit verification already passed.
      - name: Require the release tag to name the verified commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - run: task package
      - run: task smoke
      - name: Checksum complete assets
        run: |
          cd dist
          test -f "livingproof_sim_gazebo-${VERSION}-py3-none-any.whl"
          test -f "livingproof_sim_gazebo-${VERSION}.tar.gz"
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: release-packages
          path: dist/
          retention-days: 14
      # --clobber lets a re-run of this failed job finish the existing draft
      # without moving the tag. A leftover draft stays unpublished.
      - name: Attach tested assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the release once every tested asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Verify anonymous release asset download
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          tmp="$(mktemp -d)"
          curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
          curl -fsSL "$base/livingproof_sim_gazebo-${VERSION}-py3-none-any.whl" -o "$tmp/livingproof_sim_gazebo-${VERSION}-py3-none-any.whl"
          curl -fsSL "$base/livingproof_sim_gazebo-${VERSION}.tar.gz" -o "$tmp/livingproof_sim_gazebo-${VERSION}.tar.gz"
          (cd "$tmp" && sha256sum -c SHA256SUMS)
